name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      SKIP_SYSTEM_ICON_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check source and test core behavior
        run: |
          make check
          make test
      - name: Build release files
        run: make dmg
      - name: Verify release files
        run: make verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-files-arm64
          path: |
            dist/*/*.dmg
            dist/*/*-source.zip
            dist/*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
