name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SKIP_SYSTEM_ICON_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate version tag
        id: release-mode
        shell: bash
        run: |
          source scripts/common.sh
          test "$GITHUB_REF_NAME" = "v$PROJECT_VERSION"
          if [[ "$(git cat-file -t "$GITHUB_REF")" == tag ]] && \
             git for-each-ref --format='%(contents)' "$GITHUB_REF" | grep -Fxq 'Publish-Release: true'; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check source and test core behavior
        run: |
          make check
          make test
      - name: Build and verify
        run: |
          make dmg
          make verify
      - name: Create a draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          source scripts/common.sh
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_DIR/$DMG_NAME" \
            "$RELEASE_DIR/$SOURCE_NAME" \
            "$RELEASE_DIR/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft \
            --title "ChatGPT Proxy Launcher $PROJECT_VERSION" \
            --notes-file docs/RELEASE_NOTES.md
      - name: Publish when explicitly requested by the annotated tag
        if: steps.release-mode.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
